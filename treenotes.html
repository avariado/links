<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Notas</title>
  <style>
    :root { --bg:#f7f7f5; --paper:#fff; --text:#252525; --muted:#787774; --line:#e7e7e4; --hover:#f1f1ef; --accent:#2383e2; --danger:#eb5757; --shadow:0 12px 36px rgba(15,15,15,.12); }
    [data-theme="dark"] { --bg:#191919; --paper:#202020; --text:#efefef; --muted:#9b9b9b; --line:#333; --hover:#292929; --accent:#529cca; --danger:#ff7369; --shadow:0 14px 40px rgba(0,0,0,.38); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.55 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; }
    .app { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:52px 0 100px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:26px; }
    h1 { margin:0; font-size:30px; letter-spacing:-.035em; line-height:1.15; }
    .toolbar { display:flex; align-items:center; gap:6px; }
    .icon-btn,.add-btn,.menu button { border:0; background:transparent; cursor:pointer; border-radius:7px; }
    .icon-btn { width:34px; height:34px; display:grid; place-items:center; color:var(--muted); }
    .icon-btn:hover,.icon-btn:focus-visible,.menu button:hover { background:var(--hover); color:var(--text); }
    .search-row { display:flex; align-items:center; gap:7px; margin-bottom:14px; }
    .search { min-width:0; flex:1; border:1px solid var(--line); background:var(--paper); color:var(--text); border-radius:9px; padding:10px 12px; outline:none; }
    .search:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent); }
    .result-count { min-width:45px; text-align:center; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .nav-btn { width:34px; height:38px; border:1px solid var(--line); background:var(--paper); border-radius:8px; cursor:pointer; color:var(--muted); }
    .nav-btn:hover:not(:disabled) { background:var(--hover); color:var(--text); }
    .nav-btn:disabled { opacity:.35; cursor:default; }
    .notes { position:relative; }
    .note { position:relative; min-height:46px; padding:11px 42px 11px 14px; border-bottom:1px solid var(--line); background:transparent; cursor:text; white-space:pre-wrap; overflow-wrap:anywhere; outline:none; transition:background .12s,opacity .12s; }
    .note:first-child { border-top:1px solid var(--line); }
    .note:hover { background:var(--hover); }
    .note:focus { background:var(--paper); box-shadow:inset 3px 0 var(--accent); }
    .note a { color:var(--accent); text-decoration:none; }
    .note a:hover { text-decoration:underline; }
    mark { background:#ffe66a; color:#242424; border-radius:3px; padding:0 1px; }
    mark.current { background:#ffb224; outline:2px solid color-mix(in srgb,#ffb224 38%,transparent); }
    .more { color:var(--muted); margin-left:6px; }
    .grip { position:absolute; right:0; top:0; bottom:0; width:42px; display:flex; align-items:center; justify-content:center; color:var(--muted); opacity:.55; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
    .grip svg { width:10px; height:16px; pointer-events:none; }
    .note:hover .grip,.grip:hover { opacity:1; }
    .note.dragging { opacity:.35; }
    .drop-line { height:2px; background:var(--accent); position:absolute; left:0; right:0; z-index:4; pointer-events:none; border-radius:2px; box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent); }
    .empty { text-align:center; padding:64px 20px; color:var(--muted); }
    .empty strong { display:block; color:var(--text); font-size:16px; margin-bottom:3px; }
    .add-btn { width:100%; margin-top:14px; padding:10px 12px; text-align:left; color:var(--muted); }
    .add-btn:hover { background:var(--hover); color:var(--text); }
    .status { min-height:22px; margin-top:12px; color:var(--muted); font-size:12px; text-align:right; }
    .menu { position:fixed; z-index:20; min-width:185px; padding:6px; border:1px solid var(--line); border-radius:10px; background:var(--paper); box-shadow:var(--shadow); display:none; }
    .menu.open { display:block; }
    .menu button { width:100%; padding:7px 10px; text-align:left; }
    .menu hr { border:0; border-top:1px solid var(--line); margin:5px 2px; }
    .shortcut { float:right; color:var(--muted); font-size:12px; margin-left:20px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%,16px); background:var(--text); color:var(--bg); border-radius:8px; padding:9px 13px; opacity:0; pointer-events:none; transition:.2s; font-size:13px; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .auth-card { margin:70px auto; width:min(420px,calc(100% - 32px)); padding:28px; border:1px solid var(--line); border-radius:14px; background:var(--paper); box-shadow:var(--shadow); }
    .auth-card h2 { margin:0 0 6px; font-size:22px; letter-spacing:-.025em; }
    .auth-card p { margin:0 0 20px; color:var(--muted); }
    .auth-form { display:grid; gap:9px; }
    .auth-form input { min-width:0; flex:1; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); padding:10px 12px; outline:none; }
    .auth-actions { display:flex; gap:8px; }
    .auth-actions button { flex:1; }
    .primary-btn { border:0; border-radius:8px; background:var(--text); color:var(--bg); padding:10px 14px; cursor:pointer; white-space:nowrap; }
    .secondary-btn { border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); padding:10px 14px; cursor:pointer; white-space:nowrap; }
    .secondary-btn:hover { background:var(--hover); }
    .primary-btn:disabled { opacity:.55; cursor:wait; }
    .auth-note { margin-top:14px!important; margin-bottom:0!important; font-size:12px; }
    .account { display:flex; justify-content:flex-end; align-items:center; gap:7px; margin:-16px 0 12px; color:var(--muted); font-size:12px; }
    .text-btn { border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer; padding:6px 8px; }
    .text-btn:hover { background:var(--hover); color:var(--text); }
    /* Ecrãs tácteis: sem seleção de texto nas notas, para o toque longo servir para eliminar/reordenar */
    @media (pointer:coarse) {
      .note:not([contenteditable="true"]) { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
      .grip { opacity:.8; }
    }
    [hidden] { display:none!important; }
    @media (max-width:600px) { .app{width:min(100% - 24px,760px);padding-top:28px} header{align-items:flex-start}.shortcut{display:none} }
  </style>
</head>
<body>
  <section class="auth-card" id="authCard" hidden>
    <h2>As suas notas, em todo o lado</h2>
    <p>Entre com o seu e-mail e palavra-passe.</p>
    <form class="auth-form" id="authForm">
      <input id="email" type="email" autocomplete="email" placeholder="nome@exemplo.pt" required aria-label="Endereço de e-mail">
      <input id="password" type="password" autocomplete="current-password" placeholder="Palavra-passe" minlength="6" required aria-label="Palavra-passe">
      <div class="auth-actions">
        <button class="primary-btn" id="loginBtn" type="submit">Entrar</button>
        <button class="secondary-btn" id="signupBtn" type="button">Criar conta</button>
      </div>
      <button class="text-btn" id="forgotBtn" type="button">Definir ou recuperar palavra-passe</button>
    </form>
    <p class="auth-note" id="authMessage">Na primeira utilização, escolha “Criar conta”.</p>
  </section>
  <main class="app" id="app" hidden>
    <header>
      <h1>Notas</h1>
      <div class="toolbar">
        <button class="icon-btn" id="importBtn" title="Importar treenotes.json" aria-label="Importar treenotes.json">↑</button>
        <button class="icon-btn" id="exportBtn" title="Exportar treenotes.json" aria-label="Exportar treenotes.json">↓</button>
        <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
      </div>
    </header>
    <div class="account"><span id="accountEmail"></span><button class="text-btn" id="logoutBtn">Terminar sessão</button></div>
    <div class="search-row">
      <input class="search" id="search" type="search" placeholder="Pesquisar notas…" aria-label="Pesquisar notas">
      <span class="result-count" id="resultCount" aria-live="polite"></span>
      <button class="nav-btn" id="prevResult" title="Resultado anterior (Shift+F3)" aria-label="Resultado anterior">←</button>
      <button class="nav-btn" id="nextResult" title="Resultado seguinte (F3)" aria-label="Resultado seguinte">→</button>
    </div>
    <section class="notes" id="notes" aria-live="polite"></section>
    <button class="add-btn" id="addBtn">＋ Adicionar uma nota</button>
    <div class="status" id="status"></div>
  </main>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>
  <div class="menu" id="editMenu" role="menu">
    <button data-command="cut">Cortar <span class="shortcut">Ctrl+X</span></button>
    <button data-command="copy">Copiar <span class="shortcut">Ctrl+C</span></button>
    <button data-command="paste">Colar <span class="shortcut">Ctrl+V</span></button>
    <hr>
    <button data-command="selectAll">Selecionar tudo <span class="shortcut">Ctrl+A</span></button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const KEY='notas-minimalistas-v1';
      // Preencha estes dois valores no painel Supabase: Project Settings → API.
      const SUPABASE_URL='https://whhbsxugpzxlqanbhnwl.supabase.co/rest/v1/';
      const SUPABASE_PUBLISHABLE_KEY='sb_publishable_9ueIri6x_9BJpBh9yXchZw_kkfpk8kw';
      const $=s=>document.querySelector(s), notesEl=$('#notes'), status=$('#status'), menu=$('#editMenu');
      // Ids de notas eliminadas neste dispositivo e ainda por eliminar no servidor.
      const DKEY=KEY+'-eliminadas';
      function loadDeleted(){ try { const d=JSON.parse(localStorage.getItem(DKEY)); return Array.isArray(d)?d:[]; } catch { return []; } }
      const deleted=new Set(loadDeleted());
      function saveDeleted(){ localStorage.setItem(DKEY,JSON.stringify([...deleted])); }
      let dirty=false, syncing=false, resync=false;
      let notes=load(), active=null, menuTarget=null, drag=null, pressTimer=null, saveTimer=null, remoteTimer=null, resultIndex=-1;
      let pointerType='mouse', startX=0, startY=0, lastY=0, dropRef=null, dropLast=null, scrollRaf=0;
      // Símbolo de arrastar (seis pontos). Toque/clique longo aqui ativa a reordenação.
      const GRIP='<span class="grip" title="Pressione longamente para reordenar" aria-hidden="true"><svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></svg></span>';
      let delTimer=null, longDone=false, ignoreClick=false;
      let client=null, session=null, channel=null, applyingRemote=false, currentUserId=null, authMode='login';
      function load(){ try { const data=JSON.parse(localStorage.getItem(KEY)); return Array.isArray(data)?data:[]; } catch { return []; } }
      function persist(){
        localStorage.setItem(KEY,JSON.stringify(notes));
        status.textContent=session?'A sincronizar…':'Guardado neste dispositivo';
        if(session&&!applyingRemote){ dirty=true; clearTimeout(remoteTimer); remoteTimer=setTimeout(syncRemote,300); }
      }
      function scheduleSave(){ clearTimeout(saveTimer); status.textContent='A guardar…'; saveTimer=setTimeout(persist,180); }
      // Sincronização segura: 1) lê o servidor e junta o que veio de outros dispositivos;
      // 2) envia as notas locais; 3) elimina no servidor apenas as notas eliminadas aqui.
      async function syncRemote(){
        if(!client||!session)return;
        if(syncing){ resync=true; return; }
        syncing=true;
        try {
          const {data:remote,error:readError}=await client.from('notes').select('id,text,position,created_at,updated_at'); if(readError)throw readError;
          const gone=new Set(deleted), local=new Map(notes.map(n=>[n.id,n])); let merged=false;
          for(const row of remote||[]){
            if(gone.has(row.id))continue;
            const mine=local.get(row.id);
            if(!mine){ notes.push({id:row.id,text:row.text,createdAt:row.created_at,updatedAt:row.updated_at}); merged=true; }
            else if(new Date(row.updated_at)>new Date(mine.updatedAt)&&active?.dataset.id!==mine.id){ mine.text=row.text; mine.updatedAt=row.updated_at; merged=true; }
          }
          localStorage.setItem(KEY,JSON.stringify(notes));
          if(merged&&!active&&!drag)render();
          const rows=notes.map((n,i)=>({id:n.id,user_id:session.user.id,text:n.text,position:i,created_at:n.createdAt,updated_at:n.updatedAt}));
          if(rows.length){ const {error}=await client.from('notes').upsert(rows,{onConflict:'id'}); if(error)throw error; }
          if(gone.size){ const {error}=await client.from('notes').delete().in('id',[...gone]); if(error)throw error; gone.forEach(id=>deleted.delete(id)); saveDeleted(); }
          dirty=false;
          status.textContent='Sincronizado · '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
        } catch(error){ console.error(error); status.textContent='Erro de sincronização'; toast('Não foi possível sincronizar'); }
        finally { syncing=false; if(resync){ resync=false; syncRemote(); } }
      }
      async function loadRemote({offerMigration=false}={}){
        // Com alterações locais por enviar, não se substitui nada: faz-se a junção em syncRemote.
        if(dirty||syncing){ await syncRemote(); return; }
        const {data,error}=await client.from('notes').select('id,text,position,created_at,updated_at').order('position');
        if(error){ console.error(error); status.textContent='Erro ao carregar notas'; return; }
        if(offerMigration&&data.length===0&&notes.length&&confirm(`Encontrámos ${notes.length} ${notes.length===1?'nota':'notas'} neste navegador. Enviar para a sua conta?`)){
          await syncRemote(); toast('Notas migradas para a sua conta'); return;
        }
        applyingRemote=true;
        notes=(data||[]).filter(row=>!deleted.has(row.id)).map(row=>({id:row.id,text:row.text,createdAt:row.created_at,updatedAt:row.updated_at}));
        localStorage.setItem(KEY,JSON.stringify(notes)); applyingRemote=false; render(); status.textContent='Sincronizado';
      }
      function subscribe(){
        if(channel)client.removeChannel(channel);
        channel=client.channel('notes-'+session.user.id).on('postgres_changes',{event:'*',schema:'public',table:'notes',filter:`user_id=eq.${session.user.id}`},()=>{
          if(!active&&!drag)loadRemote();
        }).subscribe();
      }
      function esc(s=''){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
      function highlighted(text,q){
        const safe=esc(text); if(!q)return safe;
        const pattern=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        return safe.replace(new RegExp(pattern,'gi'),m=>`<mark>${m}</mark>`);
      }
      // Nota fechada: só a primeira linha com texto. Nota aberta (em edição): todas as linhas.
      function lineInfo(text){
        const lines=String(text).split(/\r?\n/), i=lines.findIndex(l=>l.trim());
        return i<0?{first:'',more:false}:{first:lines[i],more:lines.slice(i+1).some(l=>l.trim())};
      }
      function linked(text,q){
        const urlRe=/https?:\/\/[^\s]+/gi; let out='',last=0,match;
        while((match=urlRe.exec(text))){ out+=highlighted(text.slice(last,match.index),q); const url=match[0]; out+=`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${highlighted(url,q)}</a>`; last=match.index+url.length; }
        return (out+highlighted(text.slice(last),q)).replace(/\n/g,'<br>');
      }
      function render(focusId){
        const q=$('#search').value.trim().toLocaleLowerCase('pt-PT'); notesEl.innerHTML='';
        const shown=notes.filter(n=>!q||n.text.toLocaleLowerCase('pt-PT').includes(q));
        if(!shown.length){ notesEl.innerHTML=`<div class="empty"><strong>${q?'Nenhuma nota encontrada':'Ainda não há notas'}</strong>${q?'Experimente outra pesquisa.':'Clique abaixo e escreva a primeira.'}</div>`; updateSearchControls(0,q); return; }
        shown.forEach(n=>{ const el=document.createElement('div'); el.className='note'; el.dataset.id=n.id; el.tabIndex=0; const info=lineInfo(n.text), body=q?n.text:info.first; /* com pesquisa ativa mostra-se tudo, para ver as ocorrências */ el.innerHTML=(linked(body,q)||'<span style="color:var(--muted)">Nota vazia</span>')+((!q&&info.more)?'<span class="more" title="Esta nota tem mais linhas">…</span>':'')+GRIP; notesEl.appendChild(el); });
        const total=notesEl.querySelectorAll('mark').length; resultIndex=-1;
        updateSearchControls(total,q);
        if(q) status.textContent=total?`${total} ${total===1?'resultado':'resultados'} · F3 para navegar`:'Sem resultados';
        if(focusId) requestAnimationFrame(()=>edit(notesEl.querySelector(`[data-id="${focusId}"]`)));
      }
      function add(){ const n={id:crypto.randomUUID(),text:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}; notes.push(n); persist(); $('#search').value=''; render(n.id); }
      function edit(el){
        if(!el||el===active)return;
        const id=el.dataset.id;
        finish();
        // finish() reconstrói a lista; recuperar o elemento atual evita editar uma referência já removida.
        el=notesEl.querySelector(`[data-id="${id}"]`);
        if(!el)return;
        active=el;
        const n=notes.find(x=>x.id===id);
        el.contentEditable='true'; el.textContent=n.text; el.focus();
        const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
        const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      function finish(){ if(!active) return; const n=notes.find(x=>x.id===active.dataset.id); if(n){ const t=active.innerText.replace(/\n+$/,''); if(n.text!==t){ n.text=t; n.updatedAt=new Date().toISOString(); } } active.contentEditable='false'; active=null; closeMenu(); scheduleSave(); render(); }
      function remove(id){ const n=notes.find(x=>x.id===id); if(n&&confirm(`Eliminar esta nota?\n\n${n.text.slice(0,100)}`)){ notes=notes.filter(x=>x.id!==id); deleted.add(id); saveDeleted(); persist(); render(); toast('Nota eliminada'); } }
      function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
      function openMenu(x,y,target){ menuTarget=target; menu.style.left=Math.min(x,innerWidth-205)+'px'; menu.style.top=Math.min(y,innerHeight-190)+'px'; menu.classList.add('open'); }
      function closeMenu(){ menu.classList.remove('open'); menuTarget=null; }
      notesEl.addEventListener('click',e=>{
        if(ignoreClick||e.target.closest('.grip'))return;
        const el=e.target.closest('.note'); if(!el)return; if(e.target.closest('a')) return; edit(el);
      });
      notesEl.addEventListener('dblclick',e=>{ const el=e.target.closest('.note'); if(el&&el===active){ e.preventDefault(); finish(); } });
      notesEl.addEventListener('input',()=>{ if(active) status.textContent='A guardar…'; });
      // Toque longo (Android) ou clique longo / botão direito (PC) no corpo da nota elimina-a, com confirmação.
      // O símbolo de arrastar (.grip) nunca elimina: serve para reordenar.
      function longPressDelete(id){
        if(longDone)return; longDone=true; clearTimeout(delTimer);
        ignoreClick=true; remove(id); // o clique que se segue ao levantar o dedo/rato é ignorado (ver pointerup abaixo)
      }
      function releaseClickGuard(){ if(ignoreClick&&!drag)setTimeout(()=>{ ignoreClick=false; },350); }
      document.addEventListener('pointerup',releaseClickGuard); document.addEventListener('pointercancel',releaseClickGuard);
      notesEl.addEventListener('contextmenu',e=>{
        const el=e.target.closest('.note'); if(!el)return; e.preventDefault();
        if(el===active){ openMenu(e.clientX,e.clientY,active); return; }
        if(drag||e.target.closest('.grip'))return;
        longPressDelete(el.dataset.id);
      });
      $('#search').addEventListener('contextmenu',e=>{ e.preventDefault(); openMenu(e.clientX,e.clientY,e.currentTarget); });
      document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu')&&!e.target.closest('.note')) finish(); else if(!e.target.closest('.menu')) closeMenu(); });
      menu.addEventListener('pointerdown',e=>e.preventDefault());
      menu.addEventListener('click',async e=>{ const cmd=e.target.closest('button')?.dataset.command,target=menuTarget; if(!cmd||!target)return; target.focus(); if(cmd==='paste'){ try { document.execCommand('insertText',false,await navigator.clipboard.readText()); } catch { toast('Use Ctrl+V para colar'); } } else document.execCommand(cmd); closeMenu(); });
      // Pressão longa: no símbolo de arrastar reordena; no resto da nota elimina.
      notesEl.addEventListener('pointerdown',e=>{
        pointerType=e.pointerType||'mouse';
        longDone=false; ignoreClick=false; clearTimeout(pressTimer); clearTimeout(delTimer);
        const el=e.target.closest('.note');
        if(!el||el===active||e.button!==0)return;
        startX=e.clientX; startY=e.clientY; lastY=e.clientY;
        if(e.target.closest('.grip')) pressTimer=setTimeout(()=>startDrag(el,e.pointerId),pointerType==='mouse'?420:380);
        else delTimer=setTimeout(()=>longPressDelete(el.dataset.id),600);
      });
      function startDrag(el,pointerId){
        drag=el; el.classList.add('dragging');
        try { el.setPointerCapture?.(pointerId); } catch {}
        document.body.style.userSelect='none';
        if(navigator.vibrate)navigator.vibrate(15);
        updateDrop(); scrollRaf=requestAnimationFrame(autoScroll);
      }
      // Calcula onde a nota será largada e desenha a linha azul.
      function updateDrop(){
        const els=[...notesEl.querySelectorAll('.note:not(.dragging)')];
        let i=els.findIndex(el=>lastY<el.getBoundingClientRect().top+el.offsetHeight/2); if(i<0)i=els.length;
        dropRef=els[i]?.dataset.id||null; dropLast=els[els.length-1]?.dataset.id||null;
        let line=$('.drop-line'); if(!line){ line=document.createElement('div'); line.className='drop-line'; notesEl.appendChild(line); }
        const ref=els[i], last=els[els.length-1];
        line.style.top=(ref?ref.offsetTop:(last?last.offsetTop+last.offsetHeight:0))+'px';
      }
      // Desloca a página automaticamente quando se arrasta junto ao topo ou ao fundo do ecrã.
      function autoScroll(){
        if(!drag)return;
        const edge=80; let dy=0;
        if(lastY<edge)dy=-Math.ceil((edge-lastY)/6); else if(lastY>innerHeight-edge)dy=Math.ceil((lastY-(innerHeight-edge))/6);
        if(dy){ scrollBy(0,dy); updateDrop(); }
        scrollRaf=requestAnimationFrame(autoScroll);
      }
      notesEl.addEventListener('pointermove',e=>{
        if(!drag){
          if(Math.hypot(e.clientX-startX,e.clientY-startY)>10){ clearTimeout(delTimer); if(pointerType!=='mouse')clearTimeout(pressTimer); }
          return;
        }
        lastY=e.clientY; updateDrop();
      });
      // Durante o arrasto, impede que o Android desloque a página com o dedo.
      document.addEventListener('touchmove',e=>{ if(drag&&e.cancelable)e.preventDefault(); },{passive:false});
      function endDrag(){
        clearTimeout(pressTimer); clearTimeout(delTimer);
        if(!drag)return;
        cancelAnimationFrame(scrollRaf);
        const id=drag.dataset.id, from=notes.findIndex(n=>n.id===id); let changed=false;
        if(from>-1){
          const [n]=notes.splice(from,1); let to=from;
          if(dropRef){ const i=notes.findIndex(x=>x.id===dropRef); if(i>-1)to=i; }
          else if(dropLast){ const i=notes.findIndex(x=>x.id===dropLast); if(i>-1)to=i+1; }
          notes.splice(to,0,n); changed=to!==from;
        }
        drag.classList.remove('dragging'); drag=null; dropRef=dropLast=null;
        document.body.style.userSelect=''; $('.drop-line')?.remove();
        ignoreClick=true; setTimeout(()=>{ ignoreClick=false; },400);
        if(changed){ persist(); toast('Nota reorganizada'); }
        render();
      }
      document.addEventListener('pointerup',endDrag); document.addEventListener('pointercancel',endDrag);
      function nextResult(back=false){
        const marks=[...notesEl.querySelectorAll('mark')]; if(!marks.length)return;
        marks.forEach(m=>m.classList.remove('current'));
        resultIndex=(resultIndex+(back?-1:1)+marks.length)%marks.length;
        marks[resultIndex].classList.add('current'); marks[resultIndex].scrollIntoView({behavior:'smooth',block:'center'});
        $('#resultCount').textContent=`${resultIndex+1} / ${marks.length}`;
        status.textContent=`Resultado ${resultIndex+1} de ${marks.length}`;
      }
      function updateSearchControls(total,q){
        $('#resultCount').textContent=q?(total?`0 / ${total}`:'0 / 0'):'';
        $('#prevResult').disabled=$('#nextResult').disabled=!total;
      }
      $('#addBtn').onclick=add; $('#search').oninput=()=>render();
      $('#prevResult').onclick=()=>nextResult(true); $('#nextResult').onclick=()=>nextResult(false);
      $('#exportBtn').onclick=()=>{ finish(); const blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}),a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='treenotes.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('treenotes.json exportado'); };
      $('#importBtn').onclick=()=>$('#fileInput').click();
      $('#fileInput').onchange=async e=>{ try { const data=JSON.parse(await e.target.files[0].text()); if(!Array.isArray(data))throw 0; if(notes.length&&!confirm('Substituir as notas atuais pelas notas do ficheiro?'))return; const imported=data.map(n=>({id:n.id||crypto.randomUUID(),text:String(n.text||''),createdAt:n.createdAt||new Date().toISOString(),updatedAt:n.updatedAt||new Date().toISOString()})); const newIds=new Set(imported.map(n=>n.id)); notes.forEach(n=>{ if(!newIds.has(n.id))deleted.add(n.id); }); newIds.forEach(id=>deleted.delete(id)); saveDeleted(); notes=imported; persist(); render(); toast('Notas importadas'); } catch { alert('O ficheiro não contém notas válidas.'); } e.target.value=''; };
      const savedTheme=localStorage.getItem('notas-theme'); if(savedTheme)document.documentElement.dataset.theme=savedTheme;
      $('#themeBtn').onclick=()=>{ const next=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=next; localStorage.setItem('notas-theme',next); };
      document.addEventListener('keydown',e=>{ if(e.key==='F3'){ e.preventDefault(); nextResult(e.shiftKey); } if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); add(); } if(e.key==='Escape')finish(); });
      window.addEventListener('beforeunload',()=>{ if(active){ const n=notes.find(x=>x.id===active.dataset.id); if(n)n.text=active.innerText; } localStorage.setItem(KEY,JSON.stringify(notes)); });
      async function showSession(nextSession,{offerMigration=false}={}){
        session=nextSession;
        if(!session){
          currentUserId=null; $('#app').hidden=true; $('#authCard').hidden=false;
          if(channel&&client){ client.removeChannel(channel); channel=null; }
          return;
        }
        const changed=currentUserId!==session.user.id; currentUserId=session.user.id;
        if(changed){ dirty=false; clearTimeout(remoteTimer); }
        $('#authCard').hidden=true; $('#app').hidden=false; $('#accountEmail').textContent=session.user.email||'';
        await loadRemote({offerMigration:offerMigration&&changed}); subscribe();
      }
      $('#authForm').addEventListener('submit',async e=>{
        e.preventDefault();
        const button=$('#loginBtn'),email=$('#email').value.trim(),password=$('#password').value;
        if(authMode==='recovery'){
          if(password.length<6){ $('#authMessage').textContent='A nova palavra-passe deve ter pelo menos 6 caracteres.'; return; }
          button.disabled=true; $('#authMessage').textContent='A guardar a nova palavra-passe…';
          const {error}=await client.auth.updateUser({password}); button.disabled=false;
          if(error){ $('#authMessage').textContent=`Erro: ${error.message}`; return; }
          authMode='login'; $('#email').disabled=false; $('#email').hidden=false; $('#signupBtn').hidden=false; $('#forgotBtn').hidden=false; button.textContent='Entrar';
          $('#password').value=''; $('#password').placeholder='Palavra-passe'; $('#password').autocomplete='current-password';
          try { if(location.hash||location.search) history.replaceState(null,'',location.pathname); } catch {} // remove o token do endereço
          $('#authMessage').textContent='Palavra-passe definida. A abrir as notas…'; await showSession((await client.auth.getSession()).data.session);
          return;
        }
        button.disabled=$('#signupBtn').disabled=true; $('#authMessage').textContent='A entrar…';
        const {error}=await client.auth.signInWithPassword({email,password});
        button.disabled=$('#signupBtn').disabled=false;
        $('#authMessage').textContent=error?`Erro: ${error.message}`:'Sessão iniciada.';
      });
      $('#signupBtn').onclick=async()=>{
        const email=$('#email').value.trim(),password=$('#password').value;
        if(!email||password.length<6){ $('#authMessage').textContent='Introduza um e-mail e uma palavra-passe com pelo menos 6 caracteres.'; return; }
        $('#loginBtn').disabled=$('#signupBtn').disabled=true; $('#authMessage').textContent='A criar conta…';
        const redirectTo=/^https?:$/.test(location.protocol)?location.origin+location.pathname:undefined;
        const options=redirectTo?{emailRedirectTo:redirectTo}:undefined;
        const {data,error}=await client.auth.signUp({email,password,options});
        $('#loginBtn').disabled=$('#signupBtn').disabled=false;
        if(error)$('#authMessage').textContent=`Erro: ${error.message}`;
        else if(data.session)$('#authMessage').textContent='Conta criada e sessão iniciada.';
        else $('#authMessage').textContent='Conta criada. Confirme o e-mail uma única vez e depois entre com a palavra-passe.';
      };
      $('#forgotBtn').onclick=async()=>{
        const email=$('#email').value.trim();
        if(!email){ $('#authMessage').textContent='Introduza primeiro o seu e-mail.'; return; }
        const redirectTo=/^https?:$/.test(location.protocol)?location.origin+location.pathname:undefined;
        $('#forgotBtn').disabled=true; $('#authMessage').textContent='A enviar instruções…';
        const {error}=await client.auth.resetPasswordForEmail(email,redirectTo?{redirectTo}:undefined);
        $('#forgotBtn').disabled=false;
        $('#authMessage').textContent=error?`Erro: ${error.message}`:'E-mail enviado. Abra a ligação para definir uma nova palavra-passe.';
      };
      $('#logoutBtn').onclick=async()=>{ await syncRemote(); await client.auth.signOut(); };
      // Ecrã "definir nova palavra-passe" (aberto pela ligação enviada por e-mail).
      function enterRecovery(nextSession){
        session=nextSession; authMode='recovery'; $('#app').hidden=true; $('#authCard').hidden=false;
        $('#email').disabled=true; $('#email').hidden=true; $('#signupBtn').hidden=true; $('#forgotBtn').hidden=true;
        $('#password').value=''; $('#password').placeholder='Nova palavra-passe'; $('#password').autocomplete='new-password';
        $('#loginBtn').textContent='Guardar palavra-passe'; $('#authMessage').textContent='Escolha agora a sua nova palavra-passe.';
      }
      async function init(){
        const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('COLE_AQUI')&&!SUPABASE_PUBLISHABLE_KEY.includes('COLE_AQUI');
        $('#authCard').hidden=false;
        if(!configured){
          $('#authForm').hidden=true;
          $('#authMessage').innerHTML='Configure <strong>SUPABASE_URL</strong> e <strong>SUPABASE_PUBLISHABLE_KEY</strong> no código de notes.html. Consulte CONFIGURAR-SUPABASE.md.';
          return;
        }
        let normalizedProjectUrl;
        try {
          const projectUrl=new URL(SUPABASE_URL);
          if(!projectUrl.hostname.endsWith('.supabase.co')&&!projectUrl.hostname.endsWith('.supabase.net')){
            throw new Error('URL inesperado');
          }
          normalizedProjectUrl=projectUrl.origin;
        } catch {
          $('#authForm').hidden=true;
          $('#authMessage').textContent='O SUPABASE_URL não parece pertencer a um projeto Supabase.';
          return;
        }
        // Ler a ligação do e-mail ANTES de criar o cliente (que limpa o endereço). O evento PASSWORD_RECOVERY
        // dispara durante a criação do cliente, antes de existir quem o ouça; por isso deteta-se também pelo endereço.
        const linkParams=new URLSearchParams(location.hash.replace(/^#/,'')+'&'+location.search.replace(/^\?/,''));
        const recoveryLink=linkParams.get('type')==='recovery', linkError=linkParams.get('error_description');
        client=window.supabase.createClient(normalizedProjectUrl,SUPABASE_PUBLISHABLE_KEY);
        const {data:{session:initialSession}}=await client.auth.getSession();
        if(recoveryLink&&initialSession) enterRecovery(initialSession);
        else await showSession(initialSession,{offerMigration:true});
        if(linkError&&!initialSession) $('#authMessage').textContent='A ligação do e-mail é inválida ou expirou. Peça novamente a recuperação da palavra-passe.';
        client.auth.onAuthStateChange((event,nextSession)=>{
          if(event==='PASSWORD_RECOVERY'){ setTimeout(()=>enterRecovery(nextSession),0); return; }
          if(authMode==='recovery'&&event!=='SIGNED_OUT')return; // durante a definição da palavra-passe, não abrir as notas
          if(event==='SIGNED_IN'&&nextSession?.user.id===currentUserId)return;
          setTimeout(()=>showSession(nextSession,{offerMigration:event==='SIGNED_IN'}),0);
        });
      }
      render(); init();
    })();
  </script>
</body>
</html>
